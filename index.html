<!DOCTYPE html>
<html>
  <head>
    <title>Мой Мессенджер</title>
    <style>
      body { margin: 0; padding-bottom: 3rem; font-family: -apple-system, sans-serif; background: #f0f0f0; }
      #top-bar { background: #007aff; color: white; padding: 10px; text-align: center; position: sticky; top: 0; z-index: 10; }
      #to { width: 90%; padding: 8px; border-radius: 5px; border: none; margin-top: 5px; }
      #form { background: rgba(0, 0, 0, 0.15); padding: 0.25rem; position: fixed; bottom: 0; left: 0; right: 0; display: flex; height: 3rem; box-sizing: border-box; backdrop-filter: blur(10px); }
      #input { border: none; padding: 0 1rem; flex-grow: 1; border-radius: 2rem; margin: 0.25rem; font-size: 16px; }
      #input:focus { outline: none; }
      #form > button { background: #007aff; border: none; padding: 0 1rem; margin: 0.25rem; border-radius: 3px; outline: none; color: #fff; font-weight: bold; }
      #messages { list-style-type: none; margin: 0; padding: 0; }
      #messages > li { padding: 0.5rem 1rem; }
      #messages > li:nth-child(odd) { background: #fff; }
      .username { font-weight: bold; color: #007aff; margin-right: 5px; }
      .private-msg { background: #dcf8c6 !important; border-left: 4px solid #4caf50; }
      .error-msg { color: red; font-size: 12px; text-align: center; }
    </style>
  </head>
  <body>
    <div id="top-bar">
      <div>Ты вошел как: <strong id="my-name"></strong></div>
      <input id="to" autocomplete="off" placeholder="Кому написать? (оставь пустым для общего чата)" />
    </div>

    <ul id="messages"></ul>
    
    <form id="form" action="">
      <input id="input" autocomplete="off" placeholder="Напиши сообщение..." />
      <button>Отправить</button>
    </form>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      var socket = io();
      var messages = document.getElementById('messages');
      var form = document.getElementById('form');
      var input = document.getElementById('input');
      var toInput = document.getElementById('to');

      // Спрашиваем имя при входе
      var username = prompt("Как тебя зовут?");
      if (username) {
        socket.emit('set user', username);
        document.getElementById('my-name').textContent = username;
      } else {
        username = "Аноним";
        socket.emit('set user', username);
        document.getElementById('my-name').textContent = username;
      }

      form.addEventListener('submit', function(e) {
        e.preventDefault();
        if (input.value) {
          // Отправляем и текст, и получателя (если он указан)
          socket.emit('chat message', {
            text: input.value,
            to: toInput.value
          });
          input.value = '';
        }
      });

      socket.on('chat message', function(data) {
        var item = document.createElement('li');
        
        var nameSpan = document.createElement('span');
        nameSpan.className = 'username';
        nameSpan.textContent = data.user + ':';
        
        var textNode = document.createTextNode(data.text);

        if (data.isPrivate) {
          item.classList.add('private-msg');
          textNode = document.createTextNode(data.text + " (Личное для " + data.to + ")");
        }

        item.appendChild(nameSpan);
        item.appendChild(textNode);
        messages.appendChild(item);
        window.scrollTo(0, document.body.scrollHeight);
      });

      // Вывод ошибок (например, если человек не в сети)
      socket.on('error', function(msg) {
        var item = document.createElement('li');
        item.className = 'error-msg';
        item.textContent = msg;
        messages.appendChild(item);
      });
    </script>
  </body>
</html>
